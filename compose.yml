services:
  web:
    build: .
    image: playwright-zoom-service:local
    init: true
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-videos}
      DB_USER: ${DB_USER:-video_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (cp .env.example .env)}
      MAX_SIDECAR_KB: ${MAX_SIDECAR_KB:-2048}
      MAX_COMPANIES_CSV_KB: ${MAX_COMPANIES_CSV_KB:-5120}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    env_file:
      - path: .env
        required: false
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: playwright-zoom-service:local
    init: true
    restart: unless-stopped
    command: ["python", "-m", "zoom_worker"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-videos}
      DB_USER: ${DB_USER:-video_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (cp .env.example .env)}
      UPLOAD_DIR: /app/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      FFMPEG_BIN: ${FFMPEG_BIN:-ffmpeg}
      WORKER_POLL_SEC: ${WORKER_POLL_SEC:-1}
      ZOOM_TIMEOUT_SEC: ${ZOOM_TIMEOUT_SEC:-1800}
      ZOOM_MAX_ATTEMPTS: ${ZOOM_MAX_ATTEMPTS:-3}
      WORKER_STALE_SEC: ${WORKER_STALE_SEC:-1800}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    env_file:
      - path: .env
        required: false
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 60s

  enricher:
    image: playwright-zoom-service:local
    profiles: ["tools"]
    entrypoint: ["python", "enrich_companies.py"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-videos}
      DB_USER: ${DB_USER:-video_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (cp .env.example .env)}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-20}
      HTTP_DELAY_SEC: ${HTTP_DELAY_SEC:-0.5}
      ENRICH_MOCK: ${ENRICH_MOCK:-0}
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-videos}
      POSTGRES_USER: ${DB_USER:-video_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (cp .env.example .env)}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
  uploads:
