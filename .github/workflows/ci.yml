name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the minimum required, 3.12 matches the Docker image.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-web.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The unit run needs the service/enricher stack; Playwright (recorder,
          # capture test) is only installed for the integration job.
          pip install -r requirements-web.txt "pytest>=8"

      - name: Run unit tests
        run: python -m pytest -m "not integration and not docker" -q

  zoom-integration:
    name: Zoom post-processing (ffmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-web.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -r requirements-web.txt "pytest>=8"

      - name: Run ffmpeg integration tests
        # test_capture_integration.py needs the Playwright Chromium browser;
        # it skips itself when Playwright is not installed.
        run: python -m pytest tests/test_apply_zoom_integration.py -q
